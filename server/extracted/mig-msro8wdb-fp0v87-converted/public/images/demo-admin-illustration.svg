<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="100%" role="img" aria-label="Demo Admin dashboard illustration">
  <defs>
    <linearGradient id="da-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4fbff"/>
      <stop offset="1" stop-color="#c4ebff"/>
    </linearGradient>
    <linearGradient id="da-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23B7E5"/>
      <stop offset="1" stop-color="#0788C0"/>
    </linearGradient>
    <linearGradient id="da-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0788C0"/>
      <stop offset="1" stop-color="#23B7E5"/>
    </linearGradient>
    <filter id="da-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0788C0" flood-opacity="0.18"/>
    </filter>
    <filter id="da-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0788C0" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="720" height="560" rx="24" fill="url(#da-bg)"/>
  <circle cx="660" cy="70" r="120" fill="#ffffff" opacity="0.35"/>
  <circle cx="80" cy="500" r="140" fill="#ffffff" opacity="0.3"/>
  <circle cx="360" cy="24" r="8" fill="#23B7E5" opacity="0.5"/>
  <circle cx="420" cy="540" r="6" fill="#0788C0" opacity="0.4"/>
  <circle cx="200" cy="40" r="5" fill="#C1E1EF"/>

  <!-- Main dashboard card -->
  <g filter="url(#da-shadow)">
    <rect x="110" y="96" width="420" height="336" rx="20" fill="#ffffff"/>
  </g>
  <!-- Card header -->
  <path d="M130 96 h380 a20 20 0 0 1 20 20 v34 h-420 v-34 a20 20 0 0 1 20 -20 z" fill="#EEF5F9"/>
  <circle cx="146" cy="124" r="6" fill="#0788C0"/>
  <circle cx="164" cy="124" r="6" fill="#23B7E5"/>
  <circle cx="182" cy="124" r="6" fill="#C1E1EF"/>
  <circle cx="498" cy="124" r="15" fill="#23B7E5"/>
  <circle cx="498" cy="124" r="6" fill="#ffffff"/>

  <!-- Sidebar -->
  <rect x="124" y="168" width="64" height="248" rx="12" fill="#D8F1FF"/>
  <rect x="138" y="184" width="36" height="10" rx="5" fill="#0788C0"/>
  <rect x="138" y="206" width="28" height="10" rx="5" fill="#ffffff"/>
  <rect x="138" y="228" width="32" height="10" rx="5" fill="#ffffff"/>
  <rect x="138" y="250" width="26" height="10" rx="5" fill="#ffffff"/>
  <rect x="138" y="272" width="30" height="10" rx="5" fill="#ffffff"/>
  <rect x="138" y="352" width="36" height="10" rx="5" fill="#C1E1EF"/>
  <rect x="138" y="374" width="28" height="10" rx="5" fill="#C1E1EF"/>
  <circle cx="156" cy="312" r="13" fill="#ffffff"/>
  <circle cx="156" cy="312" r="6" fill="#23B7E5"/>

  <!-- Stat card 1 -->
  <rect x="204" y="168" width="150" height="92" rx="12" fill="#F8FCFF" stroke="#C4EBFF"/>
  <rect x="216" y="180" width="58" height="8" rx="4" fill="#C1E1EF"/>
  <rect x="216" y="198" width="40" height="14" rx="4" fill="#1D2A54"/>
  <rect x="216" y="224" width="70" height="7" rx="3.5" fill="#D8F1FF"/>
  <rect x="216" y="236" width="52" height="7" rx="3.5" fill="#D8F1FF"/>
  <rect x="326" y="180" width="16" height="16" rx="5" fill="#EEF5F9"/>
  <rect x="330" y="184" width="8" height="8" rx="2" fill="#23B7E5"/>

  <!-- Stat card 2 -->
  <rect x="366" y="168" width="150" height="92" rx="12" fill="#F8FCFF" stroke="#C4EBFF"/>
  <rect x="378" y="180" width="58" height="8" rx="4" fill="#C1E1EF"/>
  <rect x="378" y="198" width="30" height="14" rx="4" fill="#1D2A54"/>
  <rect x="378" y="224" width="64" height="7" rx="3.5" fill="#D8F1FF"/>
  <rect x="378" y="236" width="48" height="7" rx="3.5" fill="#D8F1FF"/>
  <path d="M488 180 h-14 a8 8 0 0 0 -8 8 v8 h22 z" fill="#0788C0"/>
  <path d="M488 196 h-14 a8 8 0 0 0 -8 -8" fill="none" stroke="#0788C0" stroke-width="3"/>

  <!-- Bar chart card -->
  <rect x="204" y="276" width="312" height="140" rx="12" fill="#F8FCFF" stroke="#C4EBFF"/>
  <rect x="216" y="288" width="72" height="8" rx="4" fill="#C1E1EF"/>
  <rect x="440" y="286" width="60" height="16" rx="8" fill="#EEF5F9"/>
  <circle cx="452" cy="294" r="3" fill="#0788C0"/>
  <circle cx="468" cy="294" r="3" fill="#23B7E5"/>
  <rect x="490" y="290" width="4" height="8" rx="2" fill="#0788C0"/>
  <rect x="496" y="290" width="4" height="8" rx="2" fill="#23B7E5"/>
  <!-- bars -->
  <rect x="224" y="372" width="26" height="26" rx="7" fill="#C1E1EF"/>
  <rect x="262" y="348" width="26" height="50" rx="7" fill="#C1E1EF"/>
  <rect x="300" y="360" width="26" height="38" rx="7" fill="url(#da-bar)"/>
  <rect x="338" y="326" width="26" height="72" rx="7" fill="#23B7E5"/>
  <rect x="376" y="340" width="26" height="58" rx="7" fill="url(#da-bar)"/>
  <rect x="414" y="304" width="26" height="94" rx="7" fill="#0788C0"/>
  <!-- baseline -->
  <rect x="216" y="398" width="288" height="4" rx="2" fill="#D8F1FF"/>

  <!-- Floating: shield security card -->
  <g filter="url(#da-soft)">
    <rect x="56" y="60" width="104" height="104" rx="22" fill="#ffffff"/>
  </g>
  <path d="M108 78 l20 9 -6 22 c-2 9 -8 15 -14 17 c-6 -2 -12 -8 -14 -17 l-6 -22 z" fill="#0788C0"/>
  <path d="M98 110 l7 7 l14 -16" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Floating: checklist card -->
  <g filter="url(#da-soft)">
    <rect x="556" y="140" width="120" height="136" rx="18" fill="#ffffff"/>
  </g>
  <rect x="572" y="158" width="56" height="9" rx="4.5" fill="#C1E1EF"/>
  <rect x="572" y="188" width="14" height="14" rx="4" fill="#23B7E5"/>
  <path d="M575 195 l3 3 l6 -7" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="594" y="190" width="66" height="8" rx="4" fill="#D8F1FF"/>
  <rect x="572" y="220" width="14" height="14" rx="4" fill="#C1E1EF"/>
  <rect x="594" y="222" width="58" height="8" rx="4" fill="#D8F1FF"/>
  <rect x="572" y="252" width="14" height="14" rx="4" fill="#C1E1EF"/>
  <rect x="594" y="254" width="50" height="8" rx="4" fill="#D8F1FF"/>

  <!-- Floating: donut / progress card -->
  <g filter="url(#da-soft)">
    <rect x="600" y="330" width="92" height="92" rx="20" fill="#ffffff"/>
  </g>
  <circle cx="646" cy="376" r="26" fill="none" stroke="#EEF5F9" stroke-width="10"/>
  <path d="M646 350 a26 26 0 0 1 22 13" fill="none" stroke="#0788C0" stroke-width="10" stroke-linecap="round"/>
  <path d="M668 363 a26 26 0 0 1 0 26" fill="none" stroke="#23B7E5" stroke-width="10" stroke-linecap="round"/>

  <!-- Floating: small dots / sparkles -->
  <circle cx="52" cy="452" r="10" fill="#23B7E5" opacity="0.7"/>
  <circle cx="680" cy="220" r="8" fill="#0788C0" opacity="0.55"/>
  <circle cx="300" cy="60" r="7" fill="#C1E1EF"/>
  <path d="M668 60 h10 M673 55 v10" stroke="#23B7E5" stroke-width="3" stroke-linecap="round"/>
</svg>
