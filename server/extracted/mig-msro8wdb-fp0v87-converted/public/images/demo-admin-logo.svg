  <!-- Wordmark -->
  <text x="88" y="66" font-family="Poppins, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="0.5" fill="#1D2A54">Demo<tspan fill="#0788C0"> Admin</tspan></text>
