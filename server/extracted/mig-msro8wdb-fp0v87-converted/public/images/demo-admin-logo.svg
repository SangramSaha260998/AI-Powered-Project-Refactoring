    <linearGradient id="da-brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0788C0"/>
      <stop offset="1" stop-color="#23B7E5"/>
    </linearGradient>
  </defs>
  <!-- Badge -->
